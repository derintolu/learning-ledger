name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer lint

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer prefix
      - run: composer test:unit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sensei LMS needs a newer WordPress than the plugin's minimum, so the
          # minimum-version row runs without it and the Sensei tests skip.
          - wp: '6.6'
            core: 'WordPress/WordPress#6.6'
            sensei: false
          - wp: latest
            core: ''
            sensei: true
    env:
      WP_ENV_CORE: ${{ matrix.core }}
      COMPOSER_PROCESS_TIMEOUT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-progress --prefer-dist
      - run: composer prefix
      - run: npm ci
      - run: npm run build
      - if: ${{ !matrix.sensei }}
        name: Leave Sensei out of the tests environment
        run: |
          cat > .wp-env.override.json <<'JSON'
          {
            "env": {
              "tests": {
                "plugins": [ "." ]
              }
            }
          }
          JSON
      - run: npx @wordpress/env start
      - run: composer test:integration
